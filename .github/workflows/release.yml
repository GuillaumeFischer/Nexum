name: Publier le launcher et les jeux
on:
  workflow_dispatch:
    inputs:
      launcher:
        description: Fabriquer aussi une nouvelle version du launcher
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm ci
      - name: Préparer et publier les jeux manquants
        run: node scripts/publish-games.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Enregistrer le catalogue publié
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Actualiser le catalogue des jeux publiés"
            git push origin HEAD:main
          } elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fabriquer le launcher Windows
        if: inputs.launcher
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Vérifier le paquet fabriqué
        if: inputs.launcher
        run: node scripts/verify-package.mjs
      - name: Publier le launcher
        if: inputs.launcher
        run: node scripts/publish-launcher.mjs
        env:
          GH_TOKEN: ${{ github.token }}
